# bouchet-jupyter config — copy to ~/.config/bouchet-jupyter/config.toml
#
# Fields a new user almost always needs to change are marked CHANGE.
# The rest are sensible defaults.

# CHANGE: SSH alias for the cluster (must be defined in ~/.ssh/config with
# ControlMaster auto / ControlPath / ControlPersist — see README).
host = "bouchet"

# Local TCP port the laptop tunnel binds to. Pick anything free.
local_port = 8888

# CHANGE: directory on the cluster where you've placed jupyter_launch.sh.
# Yale users with a PI project space often want something like
#   "$HOME/project_pi_<groupname>/<netid>/SlurmScripts"
# rather than a homedir path, since project space has more quota.
sbatch_dir = "$HOME/SlurmScripts"
sbatch_file = "jupyter_launch.sh"

# Where slurm writes stdout/stderr. Usually a subdir of sbatch_dir.
log_dir = "$HOME/SlurmScripts/job_logs"

# Per-session state (token, node, port) gets written here on the cluster
# by jupyter_launch.sh. Created automatically; rarely needs changing.
state_remote_dir = "$HOME/.jupyter-cluster"

# CHANGE: command the cluster runs to put `jupyter` on PATH before launching.
# On Bouchet a recent JupyterLab module works. On other clusters this might
# be `source ~/miniconda3/bin/activate myenv` or similar.
env_cmd = "module load JupyterLab/4.2.5-GCCcore-13.3.0"

default_profile = "gpu"

# Built-in profiles (gpu, cpu) work out of the box. Override or add more:
#
# [profiles.gpu]
# time = "04:00:00"
#
# [profiles.b200]
# partition = "gpu_b200"
# gpus = "b200:1"
# cpus = 8
# mem = "64G"
# time = "08:00:00"

# One-shot overrides applied on top of the chosen profile:
#
# [overrides]
# time = "12:00:00"
